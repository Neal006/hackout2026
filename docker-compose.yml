services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: noonshift
      POSTGRES_PASSWORD: noonshift
      POSTGRES_DB: noonshift
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noonshift"]
      interval: 2s
      retries: 15

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://noonshift:noonshift@postgres/noonshift
      SIM_SPEED: ${SIM_SPEED:-480}   # sim-seconds per real second; 480 = one day in 3 min
      OCPP: ${OCPP:-0}
    ports: ["8000:8000"]
    volumes:
      - ./noonshift:/app/noonshift
      - ./data:/app/data
      - ./docs:/app/docs
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn noonshift.api:app --host 0.0.0.0 --port 8000 --reload

  # Both front-ends are static builds: run `npm run build` in web/ and wattwise/ first.
  # Built without VITE_API_URL they talk to http://localhost:8000, which `api` exposes above.
  web:  # ops dashboard (Noonshift)
    image: nginx:alpine
    ports: ["3000:80"]
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]

  driver:  # driver app (WattWise)
    image: nginx:alpine
    ports: ["3001:80"]
    volumes:
      - ./wattwise/dist:/usr/share/nginx/html:ro
    depends_on: [api]
